# Конфигурация OreControl
# enabled: true/false - включить/выключить плагин
# Если false, плагин не будет обрабатывать генерацию руды
enabled: true

# use-nfc-generation: true/false - включить/выключить NFC-генерацию (редкая генерация из бета 1.7.3)
# Если true, используется логика с шансами и разными типами генераторов (настройки из секции nfc-generation)
# Если false, используется старая логика с фиксированным количеством жил (настройки из секции default-generation)
use-nfc-generation: true

# debug-logging: true/false - включить/выключить отладочное логирование генерации руды
# Если true, в консоль будут выводиться логи о том, сколько какой руды было сгенерировано
# Полезно для отладки и проверки правильности работы генерации
# ВАЖНО: отключите в продакшене, так как это может засорить логи!
debug-logging: false

# ============================================================================
# СТАРАЯ ЛОГИКА (default-generation) - используется когда use-nfc-generation: false
# ============================================================================
# Множитель частоты спавна руды
# 1.0 = нормальная частота (по умолчанию)
# 0.5 = в 2 раза меньше
# 2.0 = в 2 раза больше
# 0.0 = отключить спавн этой руды
#
# ВАЖНО: Если руда указана в конфиге, ванильная генерация этой руды будет
# полностью отключена и заменена генерацией плагина. Даже при множителе 1.0
# ванильная руда удаляется, и генерируется только руда плагина.
# Чтобы вернуть ванильную генерацию, просто удалите руду из конфига.

default-generation:
  worlds:
    world:
      # Обычные руды
      coal_ore: 1.0
      deepslate_coal_ore: 1.0
      copper_ore: 1.0
      deepslate_copper_ore: 1.0
      iron_ore: 1.0
      deepslate_iron_ore: 1.0
      gold_ore: 1.0
      deepslate_gold_ore: 1.0
      diamond_ore: 1.0
      deepslate_diamond_ore: 1.0
      redstone_ore: 1.0
      deepslate_redstone_ore: 1.0
      lapis_ore: 1.0
      deepslate_lapis_ore: 1.0
      emerald_ore: 1.0
      deepslate_emerald_ore: 1.0
      raw_iron_block: 1.0
      raw_copper_block: 1.0

    world_nether:
      # Адские руды
      nether_gold_ore: 1.0
      nether_quartz_ore: 1.0
      ancient_debris: 1.0

# ============================================================================
# NFC-ГЕНЕРАЦИЯ (nfc-generation) - используется когда use-nfc-generation: true
# ============================================================================
# Расширенный формат настроек для каждой руды:
#
# ПАРАМЕТРЫ:
#
# multiplier: Множитель частоты спавна руды
#   - 1.0 = нормальная частота (базовый шанс без изменений)
#   - 0.5 = в 2 раза реже (шанс уменьшается в 2 раза)
#   - 2.0 = в 2 раза чаще (шанс увеличивается в 2 раза)
#   - 0.0 = отключить спавн этой руды полностью
#   Влияет на финальный шанс: finalChance = baseChance * multiplier
#
# generator-type: Тип генератора руды (влияет на форму и распределение руды)
#   - minable: Эллипсоидные жилы (изогнутые, плавные формы)
#     * Создает естественные извилистые жилы руды
#     * Использует параметр vein-size для размера жилы
#     * Подходит для большинства руд (алмаз, лазурит, редстоун и т.д.)
#   - concentrated: Концентрированные скопления (несколько жил в радиусе)
#     * Создает несколько жил в определенном радиусе
#     * Использует параметры: radius (радиус), veins (количество жил), vein-size (размер каждой жилы)
#     * Подходит для угля и других руд, которые должны генерироваться скоплениями
#   - cloud: Облака руды (сферические скопления с переменной плотностью)
#     * Создает сферические скопления руды
#     * Использует параметры: radius (радиус), density (плотность), amount (количество точек)
#     * Подходит для железа, золота, меди (создает большие скопления)
#
# base-chance: Базовый шанс генерации руды в чанке (0.0 - 1.0)
#   - 0.0 = никогда не генерируется
#   - 0.04 = 1/25 шанс (очень редко, например алмаз)
#   - 0.5 = 1/2 шанс (часто, например лазурит)
#   - 1.0 = всегда генерируется (100% шанс)
#   Финальный шанс = base-chance * multiplier (не может превышать 1.0)
#
# vein-size: Размер жилы руды (количество блоков в жиле)
#   - Используется для типов: minable и concentrated
#   - 1 = очень маленькая жила (1 блок)
#   - 8 = средняя жила (например, алмаз)
#   - 17 = большая жила (например, уголь)
#   - Чем больше значение, тем больше блоков руды будет в одной жиле
#
# radius: Радиус генерации (используется для concentrated и cloud)
#   - Для concentrated: радиус, в котором размещаются несколько жил
#   - Для cloud: радиус сферического облака руды
#   - Обычно от 4 до 16
#
# density: Плотность облака (используется только для cloud)
#   - Влияет на распределение точек в облаке
#   - 0 = равномерное распределение
#   - 2-4 = более концентрированное распределение
#
# amount: Количество точек в облаке (используется только для cloud)
#   - Определяет, сколько блоков руды будет в облаке
#   - Больше значение = больше руды в облаке
#
# veins: Количество жил (используется только для concentrated)
#   - Определяет, сколько отдельных жил будет сгенерировано в радиусе
#   - Обычно от 2 до 6
#
# attempts: Количество попыток генерации за чанк
#   - Определяет, сколько раз будет попытка сгенерировать руду в одном чанке
#   - 1 = одна попытка (по умолчанию для большинства руд)
#   - 2-6 = несколько попыток (для руд, которые должны генерироваться чаще)
#   - В оригинальном коде Beta 1.7.3: редстоун = 3, медь = 3-6, уголь = 1-2
#   - Если base-chance = 1.0, руда генерируется на каждой попытке
#   - Если base-chance < 1.0, шанс проверяется для каждой попытки отдельно
#
# ПРИМЕРЫ:
# coal_ore:
#   multiplier: 1.0
#   generator-type: minable  # minable/concentrated/cloud
#   base-chance: 0.05        # Базовый шанс генерации (0.0 - 1.0)
#   vein-size: 17            # Размер жилы (для minable и concentrated)
#   radius: 10               # Радиус (для concentrated и cloud)
#   density: 2               # Плотность (для cloud)
#   amount: 80               # Количество точек (для cloud)
#   veins: 3                 # Количество жил (для concentrated)
#   attempts: 1              # Количество попыток генерации за чанк
#
# Или простой формат (только множитель, остальные параметры будут дефолтными):
# coal_ore: 1.0

nfc-generation:
  worlds:
    world:
      # Обычные руды
      # Настройки основаны на логике из бета 1.7.3

      # Угольная руда - используется CONCENTRATED (концентрированные скопления)
      # В коде: всегда генерируется (без условия) + цикл 1-2 раза
      # Увеличено attempts до 4, чтобы компенсировать жилы, которые могут генерироваться за пределами чанка
      coal_ore:
        multiplier: 1.0
        generator-type: concentrated
        base-chance: 1.0
        radius: 5
        veins: 2
        vein-size: 16
        attempts: 10
      deepslate_coal_ore:
        multiplier: 1.0
        generator-type: concentrated
        base-chance: 1.0
        radius: 5
        veins: 2
        vein-size: 16
        attempts: 4

      # Медная руда - используется CLOUD (облака)
      # В коде: цикл 3-6 раз всегда + дополнительный шанс 1/3
      copper_ore:
        multiplier: 1.0
        generator-type: cloud
        base-chance: 1.0
        radius: 4
        density: 1
        amount: 16
        attempts: 6
      deepslate_copper_ore:
        multiplier: 1.0
        generator-type: cloud
        base-chance: 0.3
        radius: 4
        density: 1
        amount: 16
        attempts: 4

      # Железная руда - используется CLOUD (облака, редкая)
      # В коде: rand.nextInt(42) <= 2, шанс 3/42
      iron_ore:
        multiplier: 1.0
        generator-type: cloud
        base-chance: 0.1
        radius: 10
        density: 2
        amount: 100
      deepslate_iron_ore:
        multiplier: 1.0
        generator-type: cloud
        base-chance: 0.06
        radius: 10
        density: 2
        amount: 60

      # Золотая руда - используется CLOUD (облака, редкая)
      gold_ore:
        multiplier: 1.0
        generator-type: cloud
        base-chance: 0.1
        radius: 10
        density: 4
        amount: 12
      deepslate_gold_ore:
        multiplier: 1.0
        generator-type: cloud
        base-chance: 0.4
        radius: 10
        density: 4
        amount: 24

      # Алмазная руда - используется MINABLE (очень редкая)
      # Увеличено base-chance и attempts для более частого спавна
      diamond_ore:
        multiplier: 1.0
        generator-type: minable
        base-chance: 0.05
        vein-size: 8
        attempts: 2
      deepslate_diamond_ore:
        multiplier: 1.0
        generator-type: minable
        base-chance: 0.5
        vein-size: 8
        attempts: 3

      # Редстоун руда - используется MINABLE (частая)
      # В коде: for (int k2 = 0; k2 < 3; k2++) - всегда генерируется 3 раза
      redstone_ore:
        multiplier: 1.0
        generator-type: minable
        base-chance: 1.0
        vein-size: 7
        attempts: 6
      deepslate_redstone_ore:
        multiplier: 1.0
        generator-type: minable
        base-chance: 1.0
        vein-size: 7
        attempts: 14

      # Лазурит руда - используется MINABLE (частая)
      lapis_ore:
        multiplier: 1.0
        generator-type: minable
        base-chance: 1.0
        vein-size: 6
        attempts: 5
      deepslate_lapis_ore:
        multiplier: 1.0
        generator-type: minable
        base-chance: 1.0
        vein-size: 8
        attempts: 4

      # Изумрудная руда - используется MINABLE
      # Используется ванильная генерация (высокие горы, от -16 до 320)
      # Не урезается, так как нужен для торговли с жителями
      emerald_ore:
        multiplier: 1.0
        generator-type: minable
        base-chance: 1.0
        vein-size: 3
        attempts: 2
      deepslate_emerald_ore:
        multiplier: 1.0
        generator-type: minable
        base-chance: 1.0
        vein-size: 3
        attempts: 2

      # Блоки сырого железа - используется MINABLE
      raw_iron_block:
        multiplier: 1.0
        generator-type: minable
        base-chance: 0.15
        vein-size: 5
      raw_copper_block:
        multiplier: 1.0
        generator-type: minable
        base-chance: 0.15
        vein-size: 5

    world_nether:
      # Адские руды
      # Кварц руда - используется MINABLE (очень частая, как в ванили)
      # В ванили генерируется ~16 раз на чанк
      nether_quartz_ore:
        multiplier: 1.0
        generator-type: minable
        base-chance: 1.0
        vein-size: 14
        attempts: 16

      # Золотая адская руда - используется MINABLE (частая)
      # В ванили генерируется ~10 раз на чанк
      nether_gold_ore:
        multiplier: 1.0
        generator-type: minable
        base-chance: 1.0
        vein-size: 10
        attempts: 10

      # Незерит - используется MINABLE (очень редкая)
      # В ванили генерируется в 2 слоя: 1-3 жилы на Y 8-22 и 1-2 жилы на Y 8-119
      # Увеличено attempts для компенсации маленького размера жил (vein-size: 2)
      ancient_debris:
        multiplier: 1.0
        generator-type: minable
        base-chance: 0.8
        vein-size: 3
        attempts: 3
# ============================================================================
# ТАБЛИЦА ОПТИМАЛЬНЫХ ВЫСОТ ДЛЯ ПОИСКА РУДЫ (ПО ЛОГИКЕ ПЛАГИНА)
# ============================================================================
# Информация о том, на каких высотах (Y-координатах) генерируется руда
# в этом плагине. Высоты основаны на коде CustomOrePopulator.java
#
# Формат: Руда | Диапазон высот (обычная) | Диапазон высот (deepslate) | Оптимальная высота
# ----------------------------------------------------------------------------
#
# ОБЫЧНЫЙ МИР (Overworld):
# ----------------------------------------------------------------------------
# Угольная руда (coal_ore)          | Y=0-329          | Y=-64-0        | Y=165 (середина диапазона)
# Медная руда (copper_ore)           | Y=0-112          | Y=-16-0        | Y=56 (середина диапазона)
# Железная руда (iron_ore)           | Y=0-70           | Y=-64-0        | Y=35 (середина диапазона)
# Золотая руда (gold_ore)            | Y=0-32           | Y=-64-0        | Y=16 (середина диапазона)
# Алмазная руда (diamond_ore)        | Y=0-16           | Y=-64-0        | Y=8 (середина диапазона)
# Редстоун (redstone_ore)            | Y=0-16           | Y=-64-0        | Y=8 (середина диапазона)
# Лазурит (lapis_ore)                | Y=0-64           | Y=-64-0        | Y=32 (середина диапазона)
# Изумрудная руда (emerald_ore)      | Y=-16-320        | Y=-64--16      | Y=152 (середина диапазона)
#                                    |                 |                | ТОЛЬКО в горных биомах!
#
# НИЖНИЙ МИР (Nether):
# ----------------------------------------------------------------------------
# Кварц (nether_quartz_ore)          | Y=10-125        | -              | Y=67 (середина диапазона)
# Золотая адская руда (nether_gold)  | Y=10-117        | -              | Y=63 (середина диапазона)
# Незерит (ancient_debris)           | Y=8-22          | -              | Y=15 (середина диапазона)
#
# ============================================================================
# СРАВНЕНИЕ С ВАНИЛЬНОЙ ГЕНЕРАЦИЕЙ MINECRAFT 1.18+
# ============================================================================
# Оценка того, во сколько раз ваша генерация меньше ванильной
# (приблизительные расчеты на основе параметров конфига)
#
# Формат: Руда | Ванильная генерация | Ваша генерация | Во сколько раз меньше
# ----------------------------------------------------------------------------
#
# ОБЫЧНЫЙ МИР (Overworld):
# ----------------------------------------------------------------------------
# Уголь (coal_ore):
#   - Ванильная: ~20 попыток/чанк, размер жилы 17, итого ~340 блоков/чанк
#   - Ваша: 10 попыток, concentrated (2 жилы по 16), итого ~320 блоков/чанк
#   - РЕЗУЛЬТАТ: примерно в 1.06 раза меньше (почти как в ванили) ✓
#
# Железо (iron_ore):
#   - Ванильная: ~20 попыток/чанк, размер жилы 9, итого ~180 блоков/чанк
#   - Ваша: 1 попытка, base-chance 0.1, cloud (amount: 100)
#   - РЕЗУЛЬТАТ: примерно в 5-10 раз меньше (ОЧЕНЬ РЕДКО!) ⚠️
#   - РЕКОМЕНДАЦИЯ: Увеличьте attempts до 2-3 или base-chance до 0.2-0.3
#
# Золото (gold_ore):
#   - Ванильная: ~2 попытки/чанк, размер жилы 9, итого ~18 блоков/чанк
#   - Ваша: 1 попытка, base-chance 0.1, cloud (amount: 12)
#   - РЕЗУЛЬТАТ: примерно в 1.5 раза меньше (приемлемо) ✓
#
# Алмаз (diamond_ore):
#   - Ванильная: ~1 попытка/чанк, размер жилы 8, шанс ~100%
#   - Ваша: 2 попытки, base-chance 0.05, размер жилы 8
#   - РЕЗУЛЬТАТ: примерно в 10 раз меньше (ОЧЕНЬ РЕДКО!) ⚠️
#   - РЕКОМЕНДАЦИЯ: Увеличьте base-chance до 0.1-0.15 для обычного алмаза
#   - ПРИМЕЧАНИЕ: deepslate_diamond_ore имеет base-chance 0.5, что лучше
#
# Редстоун (redstone_ore):
#   - Ванильная: ~8 попыток/чанк, размер жилы 8, итого ~64 блока/чанк
#   - Ваша: 6 попыток, размер жилы 7, base-chance 1.0
#   - РЕЗУЛЬТАТ: примерно в 1.2 раза меньше (почти как в ванили) ✓
#   - ПРИМЕЧАНИЕ: deepslate_redstone_ore имеет 14 попыток - даже больше ванили!
#
# Лазурит (lapis_ore):
#   - Ванильная: ~1 попытка/чанк, размер жилы 7, шанс ~100%
#   - Ваша: 5 попыток, размер жилы 6, base-chance 1.0
#   - РЕЗУЛЬТАТ: примерно в 1.4 раза БОЛЬШЕ (даже больше ванили!) ✓
#
# Медь (copper_ore):
#   - Ванильная: ~16 попыток/чанк, размер жилы 10
#   - Ваша: 6 попыток, cloud (amount: 16), base-chance 1.0
#   - РЕЗУЛЬТАТ: примерно в 1.5-2 раза меньше (приемлемо) ✓
#
# Изумруд (emerald_ore):
#   - Ванильная: ~1 попытка/чанк (только в горах), размер жилы 3
#   - Ваша: 2 попытки, размер жилы 3, base-chance 1.0
#   - РЕЗУЛЬТАТ: примерно в 2 раза БОЛЬШЕ (даже больше ванили!) ✓
#
# НИЖНИЙ МИР (Nether):
# ----------------------------------------------------------------------------
# Кварц (nether_quartz_ore):
#   - Ванильная: ~16 попыток/чанк, размер жилы 14
#   - Ваша: 16 попыток, размер жилы 14, base-chance 1.0
#   - РЕЗУЛЬТАТ: примерно как в ванили ✓
#
# Адское золото (nether_gold_ore):
#   - Ванильная: ~10 попыток/чанк, размер жилы 10
#   - Ваша: 10 попыток, размер жилы 10, base-chance 1.0
#   - РЕЗУЛЬТАТ: примерно как в ванили ✓
#
# Незерит (ancient_debris):
#   - Ванильная: ~1-3 жилы на Y 8-22, ~1-2 жилы на Y 8-119, размер жилы 2
#   - Ваша: 3 попытки, base-chance 0.8, размер жилы 3, только Y 8-22
#   - РЕЗУЛЬТАТ: примерно в 2-3 раза меньше (РЕДКО!) ⚠️
#   - РЕКОМЕНДАЦИЯ: Увеличьте attempts до 4-5 или base-chance до 1.0
#
# ============================================================================
# ОБЩИЕ ВЫВОДЫ И РЕКОМЕНДАЦИИ
# ============================================================================
# ⚠️ ПРОБЛЕМНЫЕ РУДЫ (слишком редкие):
#   1. Железо (iron_ore) - в 5-10 раз реже ванили
#   2. Алмаз (diamond_ore) - в 10 раз реже ванили
#   3. Незерит (ancient_debris) - в 2-3 раза реже ванили
#
# ✓ ХОРОШО СБАЛАНСИРОВАННЫЕ РУДЫ:
#   - Уголь, редстоун, лазурит, медь, изумруд, кварц, адское золото
#
# 💡 СОВЕТЫ ПО БАЛАНСИРОВКЕ:
#   1. Для железа: увеличьте attempts до 2-3 или base-chance до 0.2-0.3
#   2. Для алмаза: увеличьте base-chance обычного алмаза до 0.1-0.15
#   3. Для незерита: увеличьте attempts до 4-5 или добавьте второй слой генерации
#
# 📊 ОЦЕНКА СЛОЖНОСТИ ДОБЫЧИ:
#   - Железо: ОЧЕНЬ СЛОЖНО найти (в 5-10 раз реже)
#   - Алмаз: ОЧЕНЬ СЛОЖНО найти (в 10 раз реже)
#   - Незерит: СЛОЖНО найти (в 2-3 раза реже)
#   - Остальные руды: нормальная сложность (как в ванили или даже проще)
#
# ПРИМЕЧАНИЕ: В Minecraft 1.18+ максимальная высота Y=320, минимальная Y=-64
# Deepslate (глубокий сланец) начинает появляться на Y=0 и ниже

